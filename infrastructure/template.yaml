AWSTemplateFormatVersion: '2010-09-09'
Description: Event-driven Contentful backup system deployment
Parameters:
  SnsTopicArn:
    Type: String
    Description: The ARN for the SNS queue created by the Amplify app
  ContentfulSpaceId:
    Type: String
    Description: The Space ID for the Contentful space to use for content
  ContentfulDeliveryTokenArn:
    Type: String
    Description: The ARN of the SSM parameter containing the delivery token for the
      Contentful space
  ContentfulManagementTokenArn:
    Type: String
    Description: The ARN of the SSM parameter containing the management token for
      the Contentful space
  ContentfulSpaceEnvironment:
    Type: String
    Description: The environment name in Contentful space to be used
  S3BackupBucketName:
    Type: String
    Description: The name to use for the backups bucket
  InitialStorageClass:
    Type: String
    Description: The S3 storage class to use when backups are first put in the backup bucket
    AllowedValues:
      - STANDARD
      - REDUCED_REDUNDANCY
      - STANDARD_IA
      - ONEZONE_IA
      - INTELLIGENT_TIERING
      - GLACIER
      - DEEP_ARCHIVE
      - GLACIER_IR
      - EXPRESS_ONEZONE
  LongTermStorageClass:
    Type: String
    Description: The S3 storage class to use for long term storage of backups
    AllowedValues:
      - DEEP_ARCHIVE
      - GLACIER
      - GLACIER_IR
      - INTELLIGENT_TIERING
      - ONEZONE_IA
      - STANDARD_IA
  LastUpdateUrl:
    Type: String
    Description: The URL of the last update index in the site's static API
  LastUpdateWindow:
    Type: Number
    Description: The time window in minutes since the last data update within which a backup will be considered necessary
    Default: 10
  BackupLambdaFunctionName:
    Type: String
    Description: The name of the Backup Lambda function
    Default: contentful-backup
  FilterLambdaFunctionName:
    Type: String
    Description: The name of the Filter Lambda function
    Default: amplify-notification-filter
  LogRetentionDays:
    Type: Number
    Description: Retention in days for the stack-managed Lambda log groups
    Default: 90
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653
  ApplicationLogLevel:
    Type: String
    Description: Application log level for the functions; constrained so it cannot rise above INFO and hide detail
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
  MaxReceiveCount:
    Type: Number
    Description: SQS redrive maxReceiveCount for the source queue before a message is sent to the DLQ
    Default: 2
    MinValue: 1
    MaxValue: 10

Resources:
  BackupLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}/backup
      LogGroupClass: INFREQUENT_ACCESS
      RetentionInDays: !Ref LogRetentionDays

  FilterLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}/filter
      LogGroupClass: INFREQUENT_ACCESS
      RetentionInDays: !Ref LogRetentionDays

  NotifierLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}/notifier
      LogGroupClass: INFREQUENT_ACCESS
      RetentionInDays: !Ref LogRetentionDays

  BackupLambdaFunc:
    Type: AWS::Lambda::Function
    DependsOn: BackupLogGroup
    Properties:
      Architectures:
        - arm64
      # MemorySize: the previous value of 450 was not a tuned figure but a
      # stale one the workload had outgrown — the largest current backup
      # consumes ~950 MB, so the function was being OOM-killed on its largest
      # runs (a cause of the silent-failure symptom). This is the interim
      # value for the two-pass deployment; the commissioning export (see
      # tasks.md task 14) measures the real envelope and a second stack
      # update sets the final. 1536, not 1024, because 1024 leaves no
      # headroom over a known 950 MB peak.
      MemorySize: 1536
      # EphemeralStorageSize interim; measured down at commissioning. Above
      # 512 MB bills at fractions of a cent per invocation.
      EphemeralStorageSize: 2048
      Runtime: nodejs20.x
      Handler: index.handler
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: !Ref ApplicationLogLevel
        LogGroup: !Ref BackupLogGroup
      Code:
        ZipFile: |
          exports.handler = async () => {
            throw new Error('Backup Lambda placeholder: deployed code was never applied');
          };
      Environment:
        Variables:
          DELIVERY_TOKEN_ARN: !Ref ContentfulDeliveryTokenArn
          MANAGEMENT_TOKEN_ARN: !Ref ContentfulManagementTokenArn
          S3_BUCKET_NAME: !Ref S3BackupBucketName
          S3_STORAGE_CLASS: !Ref InitialStorageClass
          SPACE_ENV: !Ref ContentfulSpaceEnvironment
          SPACE_ID: !Ref ContentfulSpaceId
          SQS_QUEUE_URL: !GetAtt SQSQueue.QueueUrl
      FunctionName: !Ref BackupLambdaFunctionName
      Role: !GetAtt BackupLambdaRole.Arn
      # 900s is the Lambda on-demand maximum; it anchors the queue timing
      # chain (see SQSQueue). A longer budget would need Managed Instances,
      # which breaks the zero-compute-at-rest posture.
      Timeout: 900

  BackupLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ContentfulBackupLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: ContentfulBackupLambdaRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub ${BackupBucket.Arn}/*
              - Effect: Allow
                Action:
                  - sqs:DeleteMessage
                  - sqs:ReceiveMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt SQSQueue.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt DeadLetterQueue.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource:
                  - !Ref ContentfulDeliveryTokenArn
                  - !Ref ContentfulManagementTokenArn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub ${BackupLogGroup.Arn}:*

  FilterLambdaFunc:
    Type: AWS::Lambda::Function
    DependsOn: FilterLogGroup
    Properties:
      Architectures:
        - arm64
      Runtime: nodejs20.x
      Handler: index.handler
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: !Ref ApplicationLogLevel
        LogGroup: !Ref FilterLogGroup
      Code:
        ZipFile: |
          exports.handler = async () => {
            throw new Error('Filter Lambda placeholder: deployed code was never applied');
          };
      Environment:
        Variables:
          LAST_UPDATE_API_URL: !Ref LastUpdateUrl
          LAST_UPDATE_WINDOW: !Ref LastUpdateWindow
          SQS_QUEUE_URL: !GetAtt SQSQueue.QueueUrl
      FunctionName: !Ref FilterLambdaFunctionName
      Role: !GetAtt FilterLambdaRole.Arn
      Timeout: 30

  FilterLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AmplifyNotificationFilterLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt SQSQueue.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub ${FilterLogGroup.Arn}:*
      RoleName: AmplifyNotificationFilterLambdaRole

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: contentfulBackupDLQ.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      # Short visibility so a failed Notifier re-delivery from the DLQ is
      # retried promptly; two attempts, then the message lands in the
      # TerminalQueue rather than being lost.
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TerminalQueue.Arn
        maxReceiveCount: 2
      # Source ARN built with !Sub, not !GetAtt, to avoid the circular
      # dependency SQSQueue <-> DeadLetterQueue would otherwise create.
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:contentfulBackupQueue.fifo

  TerminalQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: contentfulBackupTerminal.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  SQSQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: contentfulBackupQueue.fifo
      FifoQueue: true
      SqsManagedSseEnabled: true
      # Timing chain — these three are coupled and must not be edited in
      # isolation:
      #   Backup Timeout (900s) -> VisibilityTimeout (>= 6x, so a retry
      #   never overlaps a still-running invocation) -> MessageRetentionPeriod
      #   (>= 2 x VisibilityTimeout x MaxReceiveCount, so a message survives
      #   long enough to reach the DLQ instead of ageing out unreachable —
      #   the original 900s retention < 1800s visibility bug).
      MessageRetentionPeriod: 1209600
      DeduplicationScope: queue
      VisibilityTimeout: 5400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount

  SQSQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SQSQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt SQSQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  DeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt DeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  TerminalQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref TerminalQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt TerminalQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  BackupLambdaSQSTrigger:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn: BackupLambdaRole
    Properties:
      BatchSize: 1
      EventSourceArn: !GetAtt SQSQueue.Arn
      Enabled: true
      FunctionName: !GetAtt BackupLambdaFunc.Arn

  FilterSNSTrigger:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FilterLambdaFunc.Arn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref SnsTopicArn

  SNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      Endpoint: !GetAtt FilterLambdaFunc.Arn
      TopicArn: !Ref SnsTopicArn

  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Ref S3BackupBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: BackupsExpiration
            Status: Enabled
            ExpirationInDays: 1095
            Transitions:
              - TransitionInDays: 60
                StorageClass: !Ref LongTermStorageClass
