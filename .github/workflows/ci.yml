name: CI

# Runs on push and PR. No deploy, no long-lived credentials, no Contentful
# call. Task 19 of backup-reliability-and-modernisation.
#
# To avoid running twice for a PR whose branch lives in this repo, push only
# builds branches that do NOT have an open PR pattern; the pull_request event
# covers the PR itself. concurrency also cancels superseded runs.
on:
  push:
    branches: [dev, main, master]
  pull_request:
  schedule:
    # Scheduled audit re-run so a newly-disclosed advisory surfaces without a push.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install root dev deps (test runner, fast-check, js-yaml)
        run: npm ci || npm install
      - name: Run the full test suite (Node built-in runner)
        run: node --test 'tests/**/*.test.js'
      - name: Run the mutation pass on the core decision logic
        run: node scripts/mutation-pass.js
      - name: Install per-function deps for audit
        run: |
          for dir in backup-lambda filter-lambda notifier-lambda deploy; do
            (cd "$dir" && npm ci --omit=dev)
          done
      - name: npm audit (production deps) — fail on CRITICAL
        # Hard gate at CRITICAL. The AWS SDK was bumped to 3.1136 which drops the
        # transitive fast-xml-parser dependency entirely, clearing the only
        # critical the pinned deps carried (see the decision record). Moderate
        # advisories are still reported but do not block; the weekly scheduled
        # run surfaces any NEW critical.
        run: |
          for dir in backup-lambda filter-lambda notifier-lambda deploy; do
            echo "== audit $dir =="
            (cd "$dir" && npm audit --omit=dev --audit-level=critical)
          done

  lint-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: cfn-lint the template (fails on error; warnings are clean)
        run: cfn-lint infrastructure/template.yaml
