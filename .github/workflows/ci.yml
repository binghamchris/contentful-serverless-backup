name: CI

# Runs on push and PR. No deploy, no long-lived credentials, no Contentful
# call. Task 19 of backup-reliability-and-modernisation.
#
# To avoid running twice for a PR whose branch lives in this repo, push only
# builds branches that do NOT have an open PR pattern; the pull_request event
# covers the PR itself. concurrency also cancels superseded runs.
on:
  push:
    branches: [dev, main, master]
  pull_request:
  schedule:
    # Scheduled audit re-run so a newly-disclosed advisory surfaces without a push.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install root dev deps (test runner, fast-check, js-yaml)
        run: npm ci || npm install
      - name: Run the full test suite (Node built-in runner)
        run: node --test 'tests/**/*.test.js'
      - name: Run the mutation pass on the core decision logic
        run: node scripts/mutation-pass.js
      - name: Install per-function deps for audit
        run: |
          for dir in backup-lambda filter-lambda notifier-lambda deploy; do
            (cd "$dir" && npm ci --omit=dev)
          done
      - name: npm audit (production deps) — REPORT ONLY
        # Reported, never a hard merge gate. The pinned AWS SDK carries a known
        # transitive fast-xml-parser critical (GHSA-8gc5-j5rx-235r et al.) that
        # is not reachable in this app — the SDK parses only AWS API XML, never
        # attacker-controlled input, and we parse Contentful JSON, not XML.
        # Fixing it needs a major SDK jump (3.709 -> 3.1136), tracked in
        # docs/backup-reliability-and-modernisation/decision-record.md. Gating a
        # merge on an unfixable-today transitive advisory is the alert-fatigue
        # trap this project exists to avoid, so this step reports and does not
        # fail the build. The weekly scheduled run surfaces any NEW advisory.
        continue-on-error: true
        run: |
          for dir in backup-lambda filter-lambda notifier-lambda deploy; do
            echo "== audit $dir =="
            (cd "$dir" && npm audit --omit=dev) || true
          done

  lint-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: cfn-lint the template (fails on error; warnings are clean)
        run: cfn-lint infrastructure/template.yaml
