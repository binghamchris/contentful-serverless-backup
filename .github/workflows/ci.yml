name: CI

# Runs on push and PR. No deploy, no long-lived credentials, no Contentful
# call. Task 19 of backup-reliability-and-modernisation.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Scheduled audit re-run so a newly-disclosed advisory surfaces without a push.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install root dev deps (test runner, fast-check, js-yaml)
        run: npm ci || npm install
      - name: Run the full test suite (Node built-in runner)
        run: node --test 'tests/**/*.test.js'
      - name: Install per-function deps for audit
        run: |
          for dir in backup-lambda filter-lambda notifier-lambda deploy; do
            (cd "$dir" && npm ci --omit=dev)
          done
      - name: npm audit (production deps) at the documented threshold
        run: |
          # Threshold: fail on CRITICAL. Moderate/high transitive SDK advisories
          # are tracked in docs/analysis and addressed by SDK minor bumps.
          for dir in backup-lambda filter-lambda notifier-lambda deploy; do
            echo "== audit $dir =="
            (cd "$dir" && npm audit --omit=dev --audit-level=critical)
          done

  lint-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: cfn-lint the template
        run: cfn-lint infrastructure/template.yaml
